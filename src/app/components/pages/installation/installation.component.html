<section class="installation__scroll-trigger installation__scroll-trigger--up"
  [class.is-visible]="isScrollUpVisible()"
  (click)="goToHome()">
  <div class="tui-scroll-indicator tui-scroll-indicator--up" [class.tui-scroll-indicator--active]="isTransitioning()">
    <div class="tui-scroll-indicator__wheel"></div>
  </div>
</section>

<div class="installation">
  <markdown
    class="installation__doc"
    [src]="'assets/pages/installation/installation_' + (translate.getCurrentLang()) + '.md'">
  </markdown>
</div>

<section class="installation__scroll-trigger" (click)="goToDemo()">
  <div class="tui-scroll-indicator tui-scroll-indicator--down" [class.tui-scroll-indicator--active]="isTransitioning()">
    <div class="tui-scroll-indicator__wheel"></div>
  </div>
</section>
