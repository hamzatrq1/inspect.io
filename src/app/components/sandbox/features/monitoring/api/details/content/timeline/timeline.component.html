<div class="timeline-wrapper">
  <!-- Barre de filtres / Légende autonome -->
  <div class="legend">
    <div class="legend-chips">
      <div class="chip api" [class.inactive]="!isFilterActive('rest')" (click)="toggleFilter('rest')">
        <span class="chip-dot"></span>HTTP
      </div>
      <div class="chip ftp" [class.inactive]="!isFilterActive('ftp')" (click)="toggleFilter('ftp')">
        <span class="chip-dot"></span>FTP
      </div>
      <div class="chip smtp" [class.inactive]="!isFilterActive('smtp')" (click)="toggleFilter('smtp')">
        <span class="chip-dot"></span>SMTP
      </div>
      <div class="chip ldap" [class.inactive]="!isFilterActive('ldap')" (click)="toggleFilter('ldap')">
        <span class="chip-dot"></span>LDAP
      </div>
      <div class="chip bdd" [class.inactive]="!isFilterActive('jdbc')" (click)="toggleFilter('jdbc')">
        <span class="chip-dot"></span>JDBC
      </div>
      <div class="chip local" [class.inactive]="!isFilterActive('local')" (click)="toggleFilter('local')">
        <span class="chip-dot"></span>LOCAL
      </div>
      <div class="chip action" [class.inactive]="!isFilterActive('action')" (click)="toggleFilter('action')">
        <span class="chip-dot"></span>Action
      </div>
    </div>
  </div>

  <img src="assets/icons/features/e2e/timeline.png" alt="Timeline" class="screenshot" />

</div>
