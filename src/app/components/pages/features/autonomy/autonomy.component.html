<div class="autonomy-intro-container">
  <section class="hero" id="autonomy-hero">
    <div class="hero__glow hero__glow--primary"></div>
    <div class="hero__glow hero__glow--secondary"></div>

    <div class="hero__badge">
      <span class="hero__badge-dot"></span>
      <span>{{ "features.autonomy.badges.title" | translate }}</span>
    </div>

    <h1 class="hero__headline">
      {{ "features.autonomy.intro.title" | translate }}
    </h1>

    <h2 class="hero__gradient">
      {{ "features.autonomy.intro.subtitle" | translate }}
    </h2>

    <p class="hero__desc">
      {{ "features.autonomy.intro.description" | translate }}
    </p>
  </section>
</div>
